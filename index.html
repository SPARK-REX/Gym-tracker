<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRACKER</title>
    <meta name="theme-color" content="#00ff88">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body oncopy="return false" oncut="return false" onpaste="return false" oncontextmenu="return false">

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1 id="app-title" class="glow-text-green" title="Click to sync"
                style="cursor: pointer; transition: text-shadow 0.3s;">TRACKER</h1>
            <div class="header-right">
                <div class="streak-header-small">
                    <span style="font-size: 1.4rem;">🔥</span> <span id="streak-count" class="glow-text-green">0</span>
                </div>
                <div class="date-display" id="current-date">-- -- ----</div>
            </div>
        </header>

        <!-- Calendar / Streak Tracker -->
        <section class="calendar-section glass-panel">
            <div class="week-calendar" id="calendar-container">
                <!-- Days will be generated by JS -->
            </div>
        </section>

        <!-- Workout Split Selector -->
        <div class="split-selector-wrapper" style="display: flex; align-items: stretch; gap: 8px;">
            <section class="split-selector" id="split-selector"
                style="flex: 1; overflow-x: auto; scrollbar-width: none;">
                <!-- JS will inject split tabs here -->
            </section>
            <button id="toggle-split-type-btn" class="split-switcher-btn" title="Switch Split Routine">
                <i class="fas fa-exchange-alt"></i>
            </button>
        </div>

        <!-- Edit/Add Controls -->
        <div class="controls-container">
            <button id="add-exercise-btn" class="glass-btn glow-btn-green"><i class="fas fa-plus"></i> Add
                Exercise</button>
            <button id="edit-mode-btn" class="glass-btn"><i class="fas fa-edit"></i> Edit List</button>
        </div>

        <!-- Exercise List Area -->
        <main class="exercise-section glass-panel">
            <div class="split-header-row">
                <h2 id="current-split-title" class="split-title glow-text-white">Push Exercises</h2>
                <div class="split-header-actions">
                    <button id="customize-day-btn" class="small-btn"><i class="fas fa-sliders-h"></i> Customize
                        Day</button>
                    <button id="revert-template-btn" class="small-btn hidden"><i class="fas fa-undo"></i>
                        Revert</button>
                </div>
            </div>
            <!-- Progress for current split -->
            <div class="split-progress-container">
                <div class="split-progress-bar" id="split-progress-bar"></div>
            </div>
            <p id="split-status-text" class="status-text glow-text-red">Workout Incomplete</p>

            <ul class="exercise-list" id="exercise-list">
                <!-- Exercises will be injected here -->
            </ul>
        </main>
    </div>

    <!-- Modal for Adding/Editing Exercise -->
    <div id="exercise-modal" class="modal hidden">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h3 id="modal-title">Add Exercise</h3>
                <button id="close-modal-btn" class="icon-btn"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <input type="text" id="exercise-name-input" placeholder="Exercise Name (e.g. Bench Press)"
                    class="glass-input">
                <input type="number" id="exercise-sets-input" placeholder="Sets (e.g. 3)" class="glass-input">
                <input type="number" id="exercise-reps-input" placeholder="Reps (e.g. 10)" class="glass-input">
                <input type="hidden" id="editing-exercise-id">
            </div>
            <div class="modal-footer">
                <button id="save-exercise-btn" class="glass-btn glow-btn-green">Save</button>
            </div>
        </div>
    </div>

    <!-- Sync / Account Modal -->
    <div id="sync-modal" class="modal hidden">
        <div class="modal-content glass-panel" style="text-align: center;">
            <div class="modal-header">
                <h3>Cloud Sync</h3>
                <button id="close-sync-btn" class="icon-btn"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <p id="sync-status" style="margin-bottom: 20px; color: var(--text-muted); font-size: 0.9rem;">Not
                    connected. Data is saved locally.</p>
                <button id="google-login-btn" class="glass-btn glow-btn-green"
                    style="justify-content: center; width: 100%;">
                    <i class="fab fa-google"></i> Sign in with Google
                </button>
                <button id="google-logout-btn" class="glass-btn"
                    style="justify-content: center; width: 100%; display: none; margin-top: 10px;">
                    <i class="fas fa-sign-out-alt"></i> Sign Out
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-database-compat.js"></script>

    <script src="app.js"></script>
</body>

</html>
